serenity {
  project.name = "Reto Tecnico SQA - HU-001 Datepicker"
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
}

headless.mode = false

webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    implicitlywait = 5000
    fluentwait = 10000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "remote-allow-origins=*", "disable-popup-blocking",
              "disable-infobars", "lang=en-US"]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://jqueryui.com/datepicker/"
  }
}
